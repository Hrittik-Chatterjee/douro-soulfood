# ═══════════════════════════════════════════════════════════════════
# D'OURO SOULFOOD BISTRO — CI Pipeline
#
# GitHub Actions workflow for Astro v6 + Cloudflare Workers.
#
# Flow:
#   1. Build (uploads dist/ as an artifact for both downstream jobs)
#   2. In parallel, both consuming only the artifact:
#        - Playwright E2E tests   against a locally served build
#        - Lighthouse CI          against a locally served build
#
# Deployment is NOT done here. Cloudflare's own Git integration ("Workers
# Builds") watches this repository directly and deploys every push itself,
# using credentials stored on Cloudflare's side — it needs nothing from this
# workflow and nothing from a GitHub Actions secret. This file used to also
# run `deploy-preview`/`deploy-production` jobs via `wrangler pages deploy`,
# authenticating with a `CLOUDFLARE_API_TOKEN` repo secret that was never
# configured, so those jobs failed on every single run. Removed rather than
# fixed, because even a valid token wouldn't have made them correct: they ran
# a Pages command (`wrangler pages deploy`) against what `@astrojs/cloudflare`
# actually emits — a Workers build (`dist/server/wrangler.json`, `main:
# entry.mjs`) — passed `dist/` instead of `dist/client` (which has no root
# `index.html`, and would place `_headers` at the wrong path, silently
# disabling the CSP), and pinned wrangler 3.x against a repo on wrangler
# ^4.92.0. Two independent, half-working deploy paths to one project was a
# footgun; the one that already works is enough.
#
# The two quality gates deliberately do NOT depend on a deploy. They used to
# depend on the (broken) preview deploy, which meant they were skipped on
# every single run — the gates existed but never once executed, which is how
# 17 E2E assertions drifted stale on `main` unnoticed and why Lighthouse
# never produced a result in 90+ runs. Reading the build artifact instead
# makes them credential-free, fork-safe, faster, and tied to the exact bytes
# that were built.
# ═══════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches:
      - main
      - '**'
  workflow_dispatch:

concurrency:
  # Only one run per branch at a time; a new push cancels the in-progress one.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Minimum permissions — principle of least privilege. No `deployments: write`
# or `statuses: write`: this workflow no longer creates GitHub Deployments.
permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.9'

jobs:
  # ═══════════════════════════════════════════════════════════════
  # JOB 1: Build
  # Installs deps, builds Astro, uploads dist/ as artifact
  # for downstream jobs to reuse (no double builds).
  # ═══════════════════════════════════════════════════════════════
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro site
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════
  # JOB 2: E2E Tests
  # Runs Playwright against the build artifact, served locally by
  # scripts/serve-dist.mjs (started automatically by playwright.config.ts).
  # Tests validate content, navigation, accessibility, and SEO.
  # ═══════════════════════════════════════════════════════════════
  e2e-tests:
    name: Playwright E2E Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # BASE_URL is deliberately NOT set: playwright.config.ts then starts
      # scripts/serve-dist.mjs on 8788 and tears it down afterwards.
      - name: Run Playwright tests
        run: |
          pnpm exec playwright test \
            --reporter=github,line \
            --timeout=30000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 3

  # ═══════════════════════════════════════════════════════════════
  # JOB 3: Lighthouse CI
  # Audits performance, accessibility, best practices, and SEO against the
  # build artifact. Fails the pipeline if any budget threshold is not met.
  # With no LHCI_URL set, .lighthouserc.cjs serves ./dist/client via a local
  # server, so no deploy and no credential are needed.
  # ═══════════════════════════════════════════════════════════════
  lighthouse:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Serves the build with br/gzip so the audit sees production-equivalent
      # transfer sizes (see the note in .lighthouserc.cjs). Backgrounded, then
      # polled until it answers — `sleep` alone would be a race.
      - name: Serve the build
        run: |
          node scripts/serve-dist.mjs --port 8788 &
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8788/; then
              echo "server up"; exit 0
            fi
            sleep 1
          done
          echo "server did not start within 30s"; exit 1

      - name: Run Lighthouse CI
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec lhci autorun --config=.lighthouserc.cjs

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 7
